<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guillaume Morvan — Portfolio</title>
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cover-focus-x: 54%;
      --cover-focus-y: 47%;

      --font-main: "Afacad", Arial, Helvetica, sans-serif;

      --weight-regular: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --weight-title: 600;

      --text-black: #111;
      --text-soft: rgba(17, 17, 17, 0.72);
      --text-light: rgba(17, 17, 17, 0.54);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: var(--font-main);
      background: #ffffff;
      color: var(--text-black);
      overflow: hidden;
      overscroll-behavior: none;
      font-weight: var(--weight-regular);
    }

    .hidden { display: none !important; }

    .home {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .home-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--cover-focus-x) var(--cover-focus-y);
      transform: none;
      display: block;
      background: #111;
    }

    .home-name {
      position: absolute;
      top: 34px;
      left: 34px;
      z-index: 2;
      border: none;
      background: transparent;
      padding: 0;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 23.2px;
      line-height: 1;
      font-weight: var(--weight-title);
      letter-spacing: 0.002em;
      text-transform: none;
      cursor: pointer;
    }

    #site {
      width: 100vw;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
    }

    .topbar {
      height: 84px;
      min-height: 84px;
      padding: 34px 34px 14px;
      background: #ffffff;
      position: relative;
      z-index: 100;
    }

    .mobile-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    #brand {
      border: none;
      background: transparent;
      padding: 0;
      font-family: var(--font-main);
      font-size: 23.2px;
      line-height: 1;
      font-weight: var(--weight-title);
      letter-spacing: 0.002em;
      text-transform: none;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-black);
      pointer-events: auto;
    }

    .mobile-menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 36px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .mobile-menu-button span {
      display: block;
      width: 35px;
      height: 3px;
      background: #111;
      border-radius: 999px;
      position: relative;
    }

    .mobile-menu-button span::before,
    .mobile-menu-button span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 35px;
      height: 3px;
      background: #111;
      border-radius: 999px;
    }

    .mobile-menu-button span::before { top: -10px; }
    .mobile-menu-button span::after { top: 10px; }

    .summary {
      position: relative;
      width: 100vw;
      height: calc(100dvh - 84px);
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .project-grid {
      width: 100vw;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background: #ffffff;
    }

    .project-grid::-webkit-scrollbar { display: none; }

    .project-card {
      width: 100vw;
      height: calc(100dvh - 84px);
      min-height: calc(100dvh - 84px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      border: none;
      background: #ffffff;
      padding: 0 34px 18px;
      text-align: center;
      cursor: pointer;
      color: #111;
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb {
      width: 78vw;
      max-width: 78vw;
      max-height: calc((100dvh - 84px) - 112px);
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      object-position: center;
      background: #f0f0f0;
      flex: 0 1 auto;
    }

    .card-text {
      width: 78vw;
      padding-top: 14px;
      display: block;
      text-align: center;
      flex: 0 0 auto;
    }

    .card-title {
      display: block;
      font-size: 14.6px;
      font-weight: var(--weight-semibold);
      letter-spacing: 0.018em;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-type {
      display: block;
      font-size: 14px;
      line-height: 1.38;
      font-weight: var(--weight-regular);
      color: #555;
      margin-bottom: 5px;
      text-align: center;
    }

    .card-line {
      display: block;
      font-size: 14px;
      line-height: 1.38;
      font-weight: var(--weight-regular);
      color: #222;
      text-align: center;
    }

    .home-project-dots {
      position: absolute;
      left: 16px;
      top: 50%;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transform: translateY(-50%);
      pointer-events: auto;
    }

    .home-project-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.22);
      cursor: pointer;
    }

    .home-project-dot-marker {
      position: absolute;
      left: 0;
      top: -5.5px;
      width: 7px;
      height: 18px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.62);
      pointer-events: none;
      will-change: transform;
    }

    .viewer {
      width: 100vw;
      height: calc(100dvh - 84px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) 24px 52px;
      background: #ffffff;
      overflow: hidden;
    }

    .document-wrap {
      min-height: 0;
      width: 100vw;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .image-stage {
      position: relative;
      width: 100vw;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .page-layer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .previous-layer {
      display: none;
      z-index: 1;
    }

    .current-layer {
      z-index: 2;
    }

    .page-image-layer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      background: #ffffff;
    }

    .mobile-page-caption {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 42px;
      z-index: 20;
      padding: 7px 10px 8px;
      font-family: var(--font-main);
      font-size: 16.2px;
      line-height: 1.32;
      font-weight: var(--weight-medium);
      letter-spacing: 0.002em;
      color: rgba(17, 17, 17, 0.84);
      text-align: center;
      text-transform: none;
      white-space: pre-line;
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      pointer-events: none;
    }

    .image-stage.animate-next-page .previous-layer {
      display: block;
      animation: outLeft 260ms ease forwards;
    }

    .image-stage.animate-next-page .current-layer {
      animation: inRight 260ms ease forwards;
    }

    .image-stage.animate-prev-page .previous-layer {
      display: block;
      animation: outRight 260ms ease forwards;
    }

    .image-stage.animate-prev-page .current-layer {
      animation: inLeft 260ms ease forwards;
    }

    .image-stage.animate-next-project .previous-layer {
      display: block;
      animation: outUp 280ms ease forwards;
    }

    .image-stage.animate-next-project .current-layer {
      animation: inBottom 280ms ease forwards;
    }

    .image-stage.animate-prev-project .previous-layer {
      display: block;
      animation: outDown 280ms ease forwards;
    }

    .image-stage.animate-prev-project .current-layer {
      animation: inTop 280ms ease forwards;
    }

    @keyframes inRight {
      from { transform: translateX(100%); opacity: 1; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes outLeft {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-100%); opacity: 1; }
    }

    @keyframes inLeft {
      from { transform: translateX(-100%); opacity: 1; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes outRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 1; }
    }

    @keyframes inBottom {
      from { transform: translateY(100%); opacity: 1; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes outUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100%); opacity: 1; }
    }

    @keyframes inTop {
      from { transform: translateY(-100%); opacity: 1; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes outDown {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(100%); opacity: 1; }
    }

    .mobile-swipe-indicator {
      height: 24px;
      padding: 0 34px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 116px;
      background: #ffffff;
      transform: translateY(-16px);
      z-index: 65;
    }

    .swipe-arrow-button {
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      font-family: var(--font-main);
      font-size: 29px;
      line-height: 1;
      color: rgba(17, 17, 17, 0.48);
      transform: translateY(-5px);
      cursor: pointer;
      width: 34px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .swipe-arrow-button:disabled {
      opacity: 0.18;
      cursor: default;
    }

    #mobile-counter {
      font-family: var(--font-main);
      font-size: 15.8px;
      line-height: 1;
      font-weight: var(--weight-medium);
      color: var(--text-light);
      white-space: nowrap;
    }

    .mobile-project-bottom {
      height: 52px;
      padding: 0 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      background: #ffffff;
      z-index: 90;
      position: relative;
    }

    .mobile-index-button,
    .mobile-info-button {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      font-family: var(--font-main);
      font-size: 16.2px;
      line-height: 1.32;
      font-weight: var(--weight-medium);
      letter-spacing: 0.002em;
      color: rgba(17, 17, 17, 0.84);
      cursor: pointer;
      white-space: nowrap;
    }

    .mobile-index-button {
      grid-column: 1;
      justify-self: start;
      text-align: left;
    }

    .mobile-info-button {
      grid-column: 3;
      justify-self: end;
      text-align: right;
    }

    #mobile-current-title {
      grid-column: 2;
      justify-self: center;
      font-family: var(--font-main);
      font-size: 18.4px;
      line-height: 1.15;
      font-weight: var(--weight-semibold);
      letter-spacing: 0;
      color: rgba(17, 17, 17, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
      text-align: center;
      cursor: pointer;
    }

    .bottom-panel {
      display: none;
    }

    .bottom-panel.open {
      display: block;
      position: fixed;
      left: 0;
      right: 0;
      top: 84px;
      bottom: 52px;
      z-index: 80;
      background: #ffffff;
      border-top: 1px solid rgba(17, 17, 17, 0.10);
      border-bottom: 1px solid rgba(17, 17, 17, 0.10);
      padding: 34px 34px 34px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .info-title {
      margin: 0 0 24px 0;
      font-family: var(--font-main);
      font-size: 24.4px;
      line-height: 1.18;
      font-weight: var(--weight-semibold);
      letter-spacing: -0.006em;
      color: var(--text-black);
      text-align: left;
    }

    .info-meta {
      margin: 0 0 30px 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    .info-meta li {
      margin: 0 0 7px 0;
      padding: 0;
      font-family: var(--font-main);
      font-size: 17px;
      line-height: 1.38;
      font-weight: var(--weight-semibold);
      letter-spacing: 0;
      color: var(--text-black);
      text-align: left;
      text-indent: 0;
    }

    .info-section-title {
      margin: 28px 0 10px 0;
      padding: 0;
      font-family: var(--font-main);
      font-size: 17px;
      line-height: 1.35;
      font-weight: var(--weight-semibold);
      letter-spacing: 0;
      color: var(--text-black);
      text-align: left;
      text-indent: 0;
    }

    .info-section-title:first-child {
      margin-top: 0;
    }

    .info-body {
      text-align: justify;
      text-align-last: left;
      hyphens: auto;
    }

    .info-body p {
      margin: 0 0 16px 0;
      font-family: var(--font-main);
      font-size: 17px;
      line-height: 1.62;
      font-weight: var(--weight-regular);
      letter-spacing: 0;
      color: var(--text-black);
      text-align: justify;
      text-align-last: left;
      text-indent: 1.4em;
      hyphens: auto;
    }

    .info-body p:last-child {
      margin-bottom: 0;
    }

    .index-list button {
      width: 100%;
      padding: 18px 0;
      border: none;
      border-bottom: 1px solid rgba(17, 17, 17, 0.12);
      background: transparent;
      text-align: left;
      color: #111;
      cursor: pointer;
      font-family: var(--font-main);
    }

    .index-number {
      display: block;
      font-size: 13.8px;
      line-height: 1.2;
      font-weight: var(--weight-medium);
      color: rgba(17, 17, 17, 0.42);
      margin-bottom: 4px;
    }

    .index-title {
      display: block;
      font-size: 20.8px;
      line-height: 1.2;
      font-weight: var(--weight-semibold);
      letter-spacing: -0.004em;
      color: var(--text-black);
    }

    .index-subtitle {
      display: block;
      font-size: 15px;
      line-height: 1.4;
      font-weight: var(--weight-regular);
      margin-top: 5px;
      color: rgba(17, 17, 17, 0.56);
    }

    .about {
      width: 100vw;
      height: calc(100dvh - 84px);
      background: #ffffff;
      overflow: hidden;
    }

    .about-feed {
      width: 100vw;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: 64px 0 0;
      margin: 0;
      scroll-padding-top: 64px;
    }

    .about-item {
      width: 100vw;
      margin: 0;
      padding: 0 0 50px 0;
      background: #ffffff;
      scroll-margin-top: 64px;
    }

    .about-item.has-image {
      padding-top: 36px;
    }

    .about-item.is-text-only {
      display: block;
      min-height: 0;
      padding: 0 34px 40px;
      background: #ffffff;
    }

    .about-item.is-quote {
      padding-top: 40px;
      padding-bottom: 54px;
    }

    .about-item.is-visual-pair-start {
      padding-bottom: 12px;
    }

    .about-item.is-visual-pair-end {
      padding-top: 0;
    }

    .about-image-title {
      padding: 0 34px 32px;
      margin: 0;
      font-family: var(--font-main);
      font-size: 22px;
      line-height: 1.22;
      font-weight: var(--weight-semibold);
      letter-spacing: -0.004em;
      color: var(--text-black);
      text-align: center;
      white-space: pre-line;
    }

    .about-image-title.has-subtitle {
      white-space: normal;
    }

    .about-title-main,
    .about-title-subtitle {
      display: block;
    }

    .about-title-subtitle {
      margin-top: 2px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: var(--weight-regular);
      letter-spacing: 0;
    }

    #about-page-3 .about-image-title {
      position: relative;
      z-index: 1;
      padding-bottom: 2px;
      background: #ffffff;
    }

    #about-page-3 .about-image-crop {
      margin-top: 0;
    }

    #about-page-3 .about-image-crop.is-contained,
    #about-page-4 .about-image-crop.is-contained {
      overflow: hidden;
    }

    #about-page-3 .about-page-image {
      margin-top: calc(-9.9674vw + 31.7778px);
    }

    #about-page-4 .about-page-image {
      margin-top: calc(-18.1759vw + 24.3596px);
    }

    #about-page-3 .about-text {
      margin-top: calc(-9.1857vw + 6.2463px);
    }

    .about-image-crop {
      width: 100vw;
      height: auto;
      overflow: hidden;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    .about-image-crop.is-contained {
      width: 100vw;
      padding: 0 34px;
      overflow: visible;
    }

    .about-page-image {
      width: 100vw;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      background: #ffffff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .about-image-crop.is-contained .about-page-image {
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center;
    }

    .about-text {
      padding: 24px 34px 0;
      background: #ffffff;
    }

    .about-item.is-text-only .about-text {
      width: 100%;
      padding: 0;
      background: #ffffff;
    }

    .about-caption {
      margin: 0 0 18px 0;
      font-family: var(--font-main);
      font-size: 22px;
      line-height: 1.24;
      font-weight: var(--weight-semibold);
      letter-spacing: -0.004em;
      color: var(--text-black);
      text-align: center;
    }

    .about-copy {
      margin: 0;
      padding: 0;
    }

    .about-copy p {
      margin: 0 0 15px 0;
      font-family: var(--font-main);
      font-size: 16.6px;
      line-height: 1.58;
      font-weight: var(--weight-regular);
      letter-spacing: 0;
      color: var(--text-black);
      text-align: justify;
      text-align-last: left;
      text-indent: 1.45em;
      hyphens: auto;
    }

    .about-copy p:last-child {
      margin-bottom: 0;
    }

    .about-item.is-quote .about-copy p {
      margin: 0 auto 10px;
      max-width: 29em;
      font-size: 24.6px;
      line-height: 1.34;
      font-weight: var(--weight-regular);
      letter-spacing: -0.008em;
      color: var(--text-black);
      text-align: center;
      text-align-last: center;
      text-indent: 0;
      hyphens: none;
    }

    .about-item.is-quote .about-copy p.quote-reference {
      margin-top: 14px;
      margin-bottom: 0;
      max-width: 31em;
      font-size: 11.8px;
      line-height: 1.32;
      font-weight: var(--weight-regular);
      letter-spacing: 0.02em;
      color: rgba(17, 17, 17, 0.40);
      text-align: center;
      text-align-last: center;
      text-indent: 0;
    }

    #about-page-6 .about-copy p {
      text-align: center;
      text-align-last: center;
      text-indent: 0;
    }

    .contact {
      width: 100vw;
      height: calc(100dvh - 84px);
      background: #ffffff;
      overflow: hidden;
    }

    .contact-feed {
      width: 100vw;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: 64px 0 0;
      margin: 0;
    }

    .contact-item {
      width: 100vw;
      margin: 0;
      padding: 42px 0 62px 0;
      background: #ffffff;
    }

    .contact-title {
      padding: 0 34px 32px;
      margin: 0;
      font-family: var(--font-main);
      font-size: 22px;
      line-height: 1.22;
      font-weight: var(--weight-semibold);
      letter-spacing: -0.004em;
      color: var(--text-black);
      text-align: center;
      white-space: pre-line;
    }

    .contact-image-wrap {
      width: 100vw;
      height: auto;
      overflow: hidden;
      margin: 0;
      padding: 0 34px;
      background: #ffffff;
    }

    .contact-image {
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #ffffff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .contact-text {
      padding: 8px 34px 0;
      background: #ffffff;
    }

    .contact-copy {
      margin: 0;
      padding: 0;
    }

    .contact-copy p {
      margin: 0 0 15px 0;

    function assetUrl(path) {
      return encodeURI(path) + `?v=${ASSET_VERSION}`;
    }

    function aboutAssetUrl(path) {
      return encodeURI(path) + `?v=${ABOUT_ASSET_VERSION}`;
    }

    function loadBestCoverImage(index = 0) {
      if (index >= COVER_IMAGES.length) return;

      const src = assetUrl(COVER_IMAGES[index]);
      const tester = new Image();

      tester.onload = () => {
        homeCoverImage.src = src;
      };

      tester.onerror = () => {
        loadBestCoverImage(index + 1);
      };

      tester.src = src;
    }

    function getImageSrc(project, num) {
      return assetUrl(`${project.folder}${project.filePrefix} (${num}).jpg`);
    }

    function getProjectCaptionSrc(project, num) {
      if (!project.captionPages.includes(num)) return "";
      return assetUrl(`${project.folder}caption (${num}).txt`);
    }

    function getAboutImageSrc(num) {
      return aboutAssetUrl(`${ABOUT_FOLDER}page (${num}).jpg`);
    }

    function getAboutTextSrc(num) {
      const item = ABOUT_ITEMS.find(item => item.num === num);
      if (!item || !item.hasText) return "";
      return aboutAssetUrl(`${ABOUT_FOLDER}page (${num}).txt`);
    }

    function getAboutCaptionSrc(num) {
      const item = ABOUT_ITEMS.find(item => item.num === num);
      if (!item || !item.hasCaption) return "";
      return aboutAssetUrl(`${ABOUT_FOLDER}caption (${num}).txt`);
    }

    function getContactImageSrc() {
      return assetUrl(`${CONTACT_FOLDER}page (${CONTACT_PAGE}).jpg`);
    }

    function getContactTextSrc() {
      return assetUrl(`${CONTACT_FOLDER}page (${CONTACT_PAGE}).txt`);
    }

    function getContactCaptionSrc() {
      return assetUrl(`${CONTACT_FOLDER}caption (${CONTACT_PAGE}).txt`);
    }

    function getVignetteSrc(filename) {
      return assetUrl(`${VIGNETTE_FOLDER}${filename}`);
    }

    function getInfoSrc(project) {
      if (!project.infoFile) return "";
      return assetUrl(project.infoFile);
    }

    function preloadImage(src) {
      if (imageCache.has(src)) return imageCache.get(src);

      const promise = new Promise(resolve => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => resolve(src);
        img.onerror = () => resolve(src);
        img.src = src;
      });

      imageCache.set(src, promise);
      return promise;
    }

    async function fetchTextFile(src) {
      if (!src) return "";

      try {
        const response = await fetch(src);
        if (!response.ok) return "";
        const text = await response.text();
        return text.trim();
      } catch (error) {
        return "";
      }
    }

    function fetchTextFileCached(src) {
      if (!src) return Promise.resolve("");
      if (textCache.has(src)) return textCache.get(src);

      const promise = fetchTextFile(src);
      textCache.set(src, promise);
      return promise;
    }

    function preloadAround(project, num) {
      if (!project || !num) return;

      [num - 1, num + 1].forEach(page => {
        if (page >= project.start && page <= project.end) {
          preloadImage(getImageSrc(project, page));
          fetchTextFileCached(getProjectCaptionSrc(project, page));
        }
      });

      const projectIndex = PROJECTS.findIndex(item => item.slug === project.slug);
      const previousProject = PROJECTS[projectIndex - 1];
      const nextProject = PROJECTS[projectIndex + 1];

      if (previousProject) {
        preloadImage(getImageSrc(previousProject, previousProject.start));
        fetchTextFileCached(getProjectCaptionSrc(previousProject, previousProject.start));
      }

      if (nextProject) {
        preloadImage(getImageSrc(nextProject, nextProject.start));
        fetchTextFileCached(getProjectCaptionSrc(nextProject, nextProject.start));
      }
    }

    function preloadAboutImages() {
      ABOUT_ITEMS.forEach(item => {
        if (item.hasImage) preloadImage(getAboutImageSrc(item.num));
      });

      preloadImage(getContactImageSrc());
    }

    function normalizeCaptionCase(text) {
      const clean = String(text || "").trim();

      if (!clean) return "";

      const letters = clean.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, "");
      const hasLower = /[a-zà-öø-ÿ]/.test(letters);
      const hasUpper = /[A-ZÀ-ÖØ-Þ]/.test(letters);

      if (!letters || hasLower || !hasUpper) {
        return clean;
      }

      return clean
        .toLocaleLowerCase("fr-FR")
        .replace(/(^|[.!?]\s+|—\s+|- )([a-zà-öø-ÿ])/g, function(match, prefix, letter) {
          return prefix + letter.toLocaleUpperCase("fr-FR");
        });
    }

    function setCaptionElement(element, caption) {
      const cleanCaption = normalizeCaptionCase(caption);

      if (!cleanCaption) {
        element.textContent = "";
        element.classList.add("hidden");
        return;
      }

      element.textContent = cleanCaption;
      element.classList.remove("hidden");
    }

    function clearUrl() {

    function updateProjectUrl(num) {

      url.searchParams.delete("about");

      if (currentProject) {

      url.searchParams.set("page", num);

    function updateAboutUrl(num) {
      const url = new URL(window.location);

      url.searchParams.delete("project");
      url.searchParams.delete("contact");
      url.searchParams.set("about", "true");
      url.searchParams.set("page", num);

      history.replaceState({}, "", url);

      url.searchParams.delete("page");

    async function loadContactPage() {

      const caption = await fetchTextFileCached(getContactCaptionSrc());

      if (caption) {
        contactTitle.textContent = caption;
        contactTitle.classList.remove("hidden");

      if (body) {
        contactText.innerHTML = `<div class="contact-copy">${renderParagraphs(body, false)}</div>`;

    function positionAboutPage(validPage) {
      trimAllAboutImages();

      if (validPage === ABOUT_PAGES[0]) {
        aboutFeed.scrollTo({ top: 0, behavior: "auto" });

        scrollToAboutPage(validPage, "auto");
      }

    function showAbout(targetPage = ABOUT_PAGES[0]) {
      home.classList.add("hidden");
      site.classList.remove("hidden");
      hideAllMainViews();
      about.classList.remove("hidden");

      currentProject = null;
      currentImage = null;

      closeDrawer();

      const validPage = ABOUT_PAGES.includes(targetPage) ? targetPage : ABOUT_PAGES[0];
      currentAboutPage = validPage;
      updateAboutUrl(validPage);

      aboutFeed.scrollTop = 0;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          positionAboutPage(validPage);
        });
      });

      setTimeout(() => {
        positionAboutPage(validPage);
      }, 120);
    }

    function scrollToAboutPage(num, behavior = "smooth") {
      const target = document.getElementById(`about-page-${num}`);
      if (!target) {
        aboutFeed.scrollTo({ top: 0, behavior });
        return;
      }

      const titleRevealOffset = num === 3 ? ABOUT_TOP_OFFSET : 0;

      aboutFeed.scrollTo({
        top: Math.max(0, target.offsetTop - ABOUT_TOP_OFFSET - titleRevealOffset),
        behavior
      });
    }

    function updateAboutPageFromScroll() {
      if (about.classList.contains("hidden")) return;

      let nearestPage = ABOUT_PAGES[0];
      let nearestDistance = Infinity;

      ABOUT_PAGES.forEach(num => {
        const element = document.getElementById(`about-page-${num}`);
        if (!element) return;

        const distance = Math.abs((element.offsetTop - ABOUT_TOP_OFFSET) - aboutFeed.scrollTop);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestPage = num;
        }
      });

      if (nearestPage !== currentAboutPage) {
        currentAboutPage = nearestPage;
        updateAboutUrl(nearestPage);
      }
    }

    function showViewer(project, targetPage, direction = "none") {
      currentProject = project;

      home.classList.add("hidden");

    async function setImageWithTransition(src, direction, caption) {
      const token = ++transitionToken;
      const currentSrc = pageImage.getAttribute("src") || "";
      const currentCaptionText = mobilePageCaption.textContent || "";
      const currentCaptionHidden = mobilePageCaption.classList.contains("hidden");

      imageStage.classList.remove(
        "animate-next-page",
        "animate-prev-page",
        "animate-next-project",
        "animate-prev-project"
      );

      if (animationTimer) {
        clearTimeout(animationTimer);
        animationTimer = null;
      }

      if (!currentSrc || direction === "none" || currentSrc === src) {
        previousLayer.style.display = "none";
        pageImage.src = src;
        setCaptionElement(mobilePageCaption, caption);
        preloadImage(src);
        return true;
      }

      await preloadImage(src);
      if (token !== transitionToken) return false;

      previousImage.src = currentSrc;

      previousPageCaption.textContent = currentCaptionText;
      if (currentCaptionHidden || !currentCaptionText) {
        previousPageCaption.classList.add("hidden");
      } else {
        previousPageCaption.classList.remove("hidden");
      }

      previousLayer.style.display = "block";
      pageImage.src = src;
      setCaptionElement(mobilePageCaption, caption);

      void imageStage.offsetWidth;
      imageStage.classList.add(direction);

      return new Promise(resolve => {
        animationTimer = setTimeout(() => {
          imageStage.classList.remove(direction);
          previousLayer.style.display = "none";
          previousImage.removeAttribute("src");
          previousPageCaption.textContent = "";
          previousPageCaption.classList.add("hidden");
          resolve(token === transitionToken);
        }, 300);
      });
    }

    function goToPage(num, direction = "none") {
      const target = parseInt(num, 10);

      if (!currentProject || !target) return;
      if (target < currentProject.start || target > currentProject.end) return;

      const requestToken = ++pageRequestToken;
      const projectAtRequest = currentProject;
      const imageAtRequest = target;
      const targetSrc = getImageSrc(projectAtRequest, imageAtRequest);
      const captionSrc = getProjectCaptionSrc(projectAtRequest, imageAtRequest);

      currentImage = target;
      closeInfoPanel();
      closeIndexPanel();

      Promise.all([
        preloadImage(targetSrc),
        fetchTextFileCached(captionSrc)
      ]).then(results => {
        if (requestToken !== pageRequestToken) return;
        if (!currentProject || currentProject.slug !== projectAtRequest.slug || currentImage !== imageAtRequest) return;

        const caption = results[1];
        setImageWithTransition(targetSrc, direction, caption);
      });

      preloadAround(projectAtRequest, imageAtRequest);
      updateProjectUrl(currentImage);
      updateMobileProjectUi();
    }

    function previousPage() {
      if (!currentProject || currentImage <= currentProject.start) return;
      goToPage(currentImage - 1, "animate-prev-page");
    }

    function nextPage() {
      if (!currentProject || currentImage >= currentProject.end) return;
      goToPage(currentImage + 1, "animate-next-page");
    }

    function previousProject() {
      if (!currentProject) return;

      const index = PROJECTS.findIndex(project => project.slug === currentProject.slug);
      if (index <= 0) return;

      const previous = PROJECTS[index - 1];
      showViewer(previous, previous.start, "animate-prev-project");
    }

    function nextProject() {
      if (!currentProject) return;

      const index = PROJECTS.findIndex(project => project.slug === currentProject.slug);
      if (index < 0 || index >= PROJECTS.length - 1) return;

      const next = PROJECTS[index + 1];
      showViewer(next, next.start, "animate-next-project");
    }

    function updateMobileProjectUi() {
      if (!currentProject || currentImage === null) return;

      const total = currentProject.end - currentProject.start + 1;
      const index = currentImage - currentProject.start + 1;

      mobileCounter.textContent = `${index}/${total}`;
      mobileCurrentTitle.textContent = currentProject.displayTitle || currentProject.title;

      prevPageButton.disabled = currentImage <= currentProject.start;
      nextPageButton.disabled = currentImage >= currentProject.end;
    }

    function renderProjectFallbackInfo(project) {
      const title = project.infoTitle || project.line || project.fullTitle || project.title;
      const body = project.fallbackInfo || project.line || "";

      const bodyHtml = body
        ? `<div class="info-body"><p>${escapeHtml(body)}</p></div>`
        : "";

      mobileInfoText.innerHTML = `
        <h2 class="info-title">${escapeHtml(title)}</h2>
        ${bodyHtml}
      `;
    }

    function renderInfoText(project, text) {
      const cleanText = (text || "").trim();
      const fallbackTitle = project.infoTitle || project.line || project.fullTitle || project.title;

      if (!cleanText) {
        renderProjectFallbackInfo(project);
        return;
      }

      const lines = cleanText.replace(/\r\n/g, "\n").split("\n");
      let cursor = 0;

      function skipEmpty() {
        while (cursor < lines.length && lines[cursor].trim() === "") cursor++;
      }

      function readBlock() {
        const block = [];
        while (cursor < lines.length && lines[cursor].trim() !== "") {
          block.push(lines[cursor].trim());
          cursor++;
        }
        return block;
      }

      skipEmpty();

      let metaLines = [];
      let title = fallbackTitle;

      const firstBlock = readBlock();

      if (firstBlock.length > 1 && !firstBlock[0].startsWith("##")) {
        metaLines = firstBlock;
      } else if (firstBlock.length === 1 && !firstBlock[0].startsWith("##")) {
        title = firstBlock[0];
      } else {
        cursor = 0;
      }

      skipEmpty();

      if (metaLines.length > 0 && cursor < lines.length) {
        const possibleTitleBlock = readBlock();

        if (
          possibleTitleBlock.length === 1 &&
          !possibleTitleBlock[0].startsWith("##") &&
          possibleTitleBlock[0].length <= 120
        ) {
          title = possibleTitleBlock[0];
        } else {
          cursor -= possibleTitleBlock.length;
        }
      }

      skipEmpty();

      const contentHtml = [];
      let paragraphLines = [];

      function flushParagraph() {
        if (paragraphLines.length === 0) return;

        const paragraph = paragraphLines.join(" ").trim();

        if (paragraph) {
          contentHtml.push(`<p>${escapeHtml(paragraph)}</p>`);
        }

        paragraphLines = [];
      }

      while (cursor < lines.length) {
        const line = lines[cursor].trim();

        if (line === "") {
          flushParagraph();
          cursor++;
          continue;
        }

        if (line.startsWith("##")) {
          flushParagraph();

          const subtitle = line.replace(/^##+/, "").trim();

          if (subtitle) {
            contentHtml.push(`<h3 class="info-section-title">${escapeHtml(subtitle)}</h3>`);
          }

          cursor++;
          continue;
        }

        paragraphLines.push(line);
        cursor++;
      }

      flushParagraph();

      const metaHtml = metaLines.length
        ? `
          <ul class="info-meta">
            ${metaLines.map(line => `<li>${escapeHtml(line)}</li>`).join("")}
          </ul>
        `
        : "";

      const bodyHtml = contentHtml.length
        ? `<div class="info-body">${contentHtml.join("")}</div>`
        : "";

      mobileInfoText.innerHTML = `
        <h2 class="info-title">${escapeHtml(title)}</h2>
        ${metaHtml}
        ${bodyHtml}
      `;
    }

    async function loadProjectInfo(project) {
      const token = ++infoToken;
      renderProjectFallbackInfo(project);

      if (!project.infoFile) return;

      try {
        const response = await fetch(getInfoSrc(project));
        if (!response.ok) return;

        const text = await response.text();

        if (token !== infoToken) return;
        if (!currentProject || currentProject.slug !== project.slug) return;

        if (text.trim().length > 0) {
          renderInfoText(project, text);
        }
      } catch (error) {
        if (token !== infoToken) return;
        renderProjectFallbackInfo(project);
      }
    }

    function trimWhiteBottomGeneric(img, wrapper) {
      if (!wrapper) return;
      if (!img.naturalWidth || !img.naturalHeight) return;

      try {
        const scanWidth = Math.min(420, img.naturalWidth);
        const scanHeight = Math.max(1, Math.round(img.naturalHeight * scanWidth / img.naturalWidth));

        const canvas = document.createElement("canvas");
        canvas.width = scanWidth;
        canvas.height = scanHeight;

        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, scanWidth, scanHeight);

        const data = ctx.getImageData(0, 0, scanWidth, scanHeight).data;
        const rowThreshold = Math.max(3, Math.floor(scanWidth * 0.01));

        let bottomContentY = scanHeight - 1;

        for (let y = scanHeight - 1; y >= 0; y--) {
          let contentPixels = 0;

          for (let x = 0; x < scanWidth; x++) {
            const index = (y * scanWidth + x) * 4;
            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];
            const a = data[index + 3];

            const isContent =
              a > 20 &&
              (r < 242 || g < 242 || b < 242);

            if (isContent) {
              contentPixels++;
              if (contentPixels >= rowThreshold) break;
            }
          }

          if (contentPixels >= rowThreshold) {
            bottomContentY = y;
            break;
          }
        }

        const safetyMargin = Math.round(scanHeight * 0.018);
        const cropY = Math.min(scanHeight, bottomContentY + safetyMargin);
        const ratio = cropY / scanHeight;

        if (ratio > 0.985) {
          wrapper.style.height = "auto";
          return;
        }

        const renderedWidth = wrapper.clientWidth || window.innerWidth;
        const fullRenderedHeight = renderedWidth * img.naturalHeight / img.naturalWidth;
        const croppedRenderedHeight = Math.ceil(fullRenderedHeight * ratio);

        wrapper.style.height = `${croppedRenderedHeight}px`;
      } catch (error) {
        wrapper.style.height = "auto";
      }
    }

    function trimWhiteBottom(img) {
      const wrapper = img.closest(".about-image-crop");
      if (!wrapper || wrapper.classList.contains("is-contained")) return;
      trimWhiteBottomGeneric(img, wrapper);
    }

    function trimAllAboutImages() {
      document.querySelectorAll(".about-page-image").forEach(img => {
        if (img.complete) {
          trimWhiteBottom(img);
        }
      });

      if (contactImage.complete) {
        trimWhiteBottomGeneric(contactImage, contactImage.closest(".contact-image-wrap"));
      }
    }

    function looksLikeQuoteReference(line) {
      const clean = String(line || "").trim().toLowerCase();

      return (
        clean.startsWith("—") ||
        clean.startsWith("–") ||
        clean.startsWith("-") ||
        clean.startsWith("source") ||
        clean.startsWith("réf") ||
        clean.includes("quirot") ||
        clean.includes("marrey") ||
        clean.includes("trelcat") ||
        clean.includes("p.") ||
        clean.includes("cosa mentale") ||
        clean.includes("archibooks")
      );
    }

    function renderParagraphs(text, isQuote = false) {
      const clean = (text || "").trim();

      if (!clean) return "";

      let paragraphs = clean
        .replace(/\r\n/g, "\n")
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean);

      if (isQuote && paragraphs.length === 1) {
        const lines = paragraphs[0]
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean);

        if (lines.length > 1 && looksLikeQuoteReference(lines[lines.length - 1])) {
          const quote = lines.slice(0, -1).join("<br>");
          const reference = lines[lines.length - 1];

          return `
            <p>${escapeHtml(quote)}</p>
            <p class="quote-reference">${escapeHtml(reference)}</p>
          `;
        }
      }

      return paragraphs
        .map((paragraph, index) => {
          const isReference = isQuote && paragraphs.length > 1 && index === paragraphs.length - 1;
          const className = isReference ? ` class="quote-reference"` : "";
          return `<p${className}>${escapeHtml(paragraph).replace(/\n/g, "<br>")}</p>`;
        })
        .join("");
    }

    async function loadAboutText(item, titleContainer, textContainer) {
      const num = item.num;
      const caption = await fetchTextFile(getAboutCaptionSrc(num));
      const body = await fetchTextFile(getAboutTextSrc(num));

      if (titleContainer) {
        if (caption) {
          if (num === 2) {
            const [mainTitle, ...subtitleLines] = caption.split(/\r?\n/);
            const subtitle = subtitleLines.join("\n").trim();

            titleContainer.classList.add("has-subtitle");
            titleContainer.innerHTML = `
              <span class="about-title-main">${escapeHtml(mainTitle.trim())}</span>
              <span class="about-title-subtitle">${escapeHtml(subtitle).replace(/\n/g, "<br>")}</span>
            `;
          } else {
            titleContainer.textContent = caption;
          }

          titleContainer.classList.remove("hidden");
        } else {
          titleContainer.classList.add("hidden");
        }
      }

      if (!caption && !body) {
        textContainer.classList.add("hidden");
        return;
      }

      const captionHtml = !titleContainer && caption
        ? `<h2 class="about-caption">${escapeHtml(caption).replace(/\n/g, "<br>")}</h2>`
        : "";

      const bodyHtml = body
        ? `<div class="about-copy">${renderParagraphs(body, item.isQuote)}</div>`
        : "";

      textContainer.innerHTML = `${captionHtml}${bodyHtml}`;
      textContainer.classList.remove("hidden");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function openMenuDrawer() {
      closeInfoPanel();
      closeIndexPanel();
      drawer.classList.add("open");
      overlay.classList.add("open");
    }

    function toggleMenuDrawer() {
      if (drawer.classList.contains("open")) closeDrawer();
      else openMenuDrawer();
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("open");
    }

    function openInfoPanel() {
      if (viewer.classList.contains("hidden")) return;
      closeDrawer();
      closeIndexPanel();
      mobileInfoPanel.classList.add("open");
    }

    function closeInfoPanel() {
      mobileInfoPanel.classList.remove("open");
    }

    function toggleInfoPanel() {
      if (mobileInfoPanel.classList.contains("open")) closeInfoPanel();
      else openInfoPanel();
    }

    function openIndexPanel() {
      if (viewer.classList.contains("hidden")) return;
      closeDrawer();
      closeInfoPanel();
      mobileIndexPanel.classList.add("open");
    }

    function closeIndexPanel() {
      mobileIndexPanel.classList.remove("open");
    }

    function toggleIndexPanel() {
      if (mobileIndexPanel.classList.contains("open")) closeIndexPanel();
      else openIndexPanel();
    }

    function buildProjectCards() {
      projectGrid.innerHTML = "";

      PROJECTS.forEach((project, index) => {
        const button = document.createElement("button");
        button.className = "project-card";
        button.dataset.index = String(index);

        button.innerHTML = `
          <img class="thumb" src="${getVignetteSrc(project.thumb)}" alt="${project.fullTitle}" />
          <span class="card-text">
            <span class="card-title">${String(index + 1).padStart(2, "0")} — ${project.title}</span>
            <span class="card-type">${project.type}</span>
            <span class="card-line">${project.line}</span>
          </span>
        `;

        button.addEventListener("click", () => showViewer(project, project.start, "none"));
        projectGrid.appendChild(button);
      });
    }

    function buildHomeProjectDots() {
      homeProjectDots.innerHTML = "";

      PROJECTS.forEach((project, index) => {
        const dot = document.createElement("button");
        dot.className = "home-project-dot";
        dot.setAttribute("aria-label", `Voir ${project.title}`);
        dot.dataset.index = String(index);

        dot.addEventListener("click", event => {
          event.stopPropagation();

          const card = projectGrid.querySelector(`.project-card[data-index="${index}"]`);
          if (!card) return;

          projectGrid.scrollTo({
            top: card.offsetTop,
            behavior: "smooth"
          });
        });

        homeProjectDots.appendChild(dot);
      });

      const marker = document.createElement("span");
      marker.id = "home-project-dot-marker";
      marker.className = "home-project-dot-marker";
      homeProjectDots.appendChild(marker);

      updateHomeProjectDots();
    }

    function updateHomeProjectDots() {
      const cards = Array.from(projectGrid.querySelectorAll(".project-card"));
      const marker = document.getElementById("home-project-dot-marker");

      if (!cards.length || !marker) return;

      const cardHeight = cards[0].offsetHeight || 1;
      const maxProgress = Math.max(0, cards.length - 1);
      const rawProgress = projectGrid.scrollTop / cardHeight;
      const progress = Math.max(0, Math.min(maxProgress, rawProgress));
      const dotStep = 16;

      marker.style.transform = `translateY(${progress * dotStep}px)`;
    }

    function requestHomeDotUpdate() {
      if (homeDotAnimationFrame) return;

      homeDotAnimationFrame = requestAnimationFrame(() => {
        homeDotAnimationFrame = null;
        updateHomeProjectDots();
      });
    }

    function buildProjectIndex() {
      mobileIndexList.innerHTML = "";

      PROJECTS.forEach((project, index) => {
        const button = document.createElement("button");

        button.innerHTML = `
          <span class="index-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="index-title">${project.displayTitle || project.title}</span>
          <span class="index-subtitle">${project.type}</span>
        `;

        button.addEventListener("click", () => {
          closeIndexPanel();
          showViewer(project, project.start, "none");
        });

        mobileIndexList.appendChild(button);
      });
    }

    function buildAboutFeed() {
      aboutFeed.innerHTML = "";

      ABOUT_ITEMS.forEach((item, index) => {
        const article = document.createElement("article");
        article.id = `about-page-${item.num}`;
        article.className = "about-item";

        if (item.hasImage) {
          article.classList.add("has-image");
        }

        if (!item.hasImage) {
          article.classList.add("is-text-only");
        }

        if (item.isQuote) {
          article.classList.add("is-quote");
        }

        if (item.visualPairStart) {
          article.classList.add("is-visual-pair-start");
        }

        if (item.visualPairEnd) {
          article.classList.add("is-visual-pair-end");
        }

        let titleContainer = null;

        if (item.hasImage) {
          titleContainer = document.createElement("h2");
          titleContainer.className = "about-image-title hidden";
          article.appendChild(titleContainer);

          const imageCrop = document.createElement("div");
          imageCrop.className = "about-image-crop";

          if (item.imageMode === "contained") {
            imageCrop.classList.add("is-contained");
          }

          const img = document.createElement("img");
          img.className = "about-page-image";
          img.src = getAboutImageSrc(item.num);
          img.alt = item.alt || `À propos — page ${item.num}`;
          img.loading = index === 0 ? "eager" : "lazy";
          img.decoding = "async";

          img.addEventListener("load", () => {
            trimWhiteBottom(img);
          });

          imageCrop.appendChild(img);
          article.appendChild(imageCrop);
        }

        const textContainer = document.createElement("div");
        textContainer.className = "about-text hidden";

        article.appendChild(textContainer);
        aboutFeed.appendChild(article);

        loadAboutText(item, titleContainer, textContainer);
      });

      preloadAboutImages();
    }

    function startGesture(x, y) {
      gestureStartX = x;
      gestureStartY = y;
      gestureActive = true;
    }

    function endProjectGesture(x, y) {
      if (!gestureActive) return;

      gestureActive = false;

      const now = Date.now();
      if (now - lastGestureTime < 220) return;
      lastGestureTime = now;

      const dx = x - gestureStartX;
      const dy = y - gestureStartY;

      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      if (absX < SWIPE_MIN && absY < SWIPE_MIN) return;

      closeInfoPanel();
      closeIndexPanel();

      if (absX > absY * DIRECTION_RATIO) {
        if (dx < 0) nextPage();
        else previousPage();
        return;
      }

      if (absY > absX * DIRECTION_RATIO) {
        if (dy < 0) nextProject();
        else previousProject();
      }
    }

    function preventGestureScroll(e) {
      e.preventDefault();
    }

    loadBestCoverImage();

    home.addEventListener("click", showSummary);

    document.getElementById("home-name").addEventListener("click", event => {
      event.stopPropagation();
      showSummary();
    });

    document.getElementById("brand").addEventListener("click", showHome);

    document.getElementById("mobile-menu-button").addEventListener("click", toggleMenuDrawer);
    document.getElementById("close-drawer").addEventListener("click", closeDrawer);

    document.getElementById("drawer-home").addEventListener("click", showSummary);
    document.getElementById("drawer-about").addEventListener("click", () => showAbout(ABOUT_PAGES[0]));

    overlay.addEventListener("click", closeDrawer);

    mobileCurrentTitle.addEventListener("click", showSummary);
    mobileIndexButton.addEventListener("click", toggleIndexPanel);
    mobileInfoButton.addEventListener("click", toggleInfoPanel);

    prevPageButton.addEventListener("click", previousPage);
    nextPageButton.addEventListener("click", nextPage);

    projectGrid.addEventListener("scroll", requestHomeDotUpdate, { passive: true });

    documentWrap.addEventListener("pointerdown", e => startGesture(e.clientX, e.clientY));
    documentWrap.addEventListener("pointerup", e => endProjectGesture(e.clientX, e.clientY));
    documentWrap.addEventListener("pointercancel", () => { gestureActive = false; });
    documentWrap.addEventListener("touchmove", preventGestureScroll, { passive: false });

    aboutFeed.addEventListener("scroll", () => {
      clearTimeout(aboutScrollTimer);
      aboutScrollTimer = setTimeout(updateAboutPageFromScroll, 120);
    });

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        trimAllAboutImages();
        updateHomeProjectDots();
      }, 150);
    });

    buildProjectCards();
    buildHomeProjectDots();
    buildProjectIndex();
    buildAboutFeed();

    const params = new URLSearchParams(window.location.search);
    const directPage = parseInt(params.get("page"), 10);
    const directProjectSlug = params.get("project");
    const directAbout = params.get("about");
    const directContact = params.get("contact");

    let directProject = null;

    if (directContact) {
      showContact();
    } else if (directAbout) {
      showAbout(directPage || ABOUT_PAGES[0]);
    } else {
      if (directProjectSlug) {
        directProject = PROJECTS.find(project => project.slug === directProjectSlug);
      }

      if (!directProject && directPage) {
        directProject = PROJECTS[0];
      }

      if (directProject) {
        showViewer(directProject, directPage || directProject.start, "none");
      }
    }
  </script>
</body>
