<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guillaume Morvan — Portfolio</title>
  <link rel="icon" href="data:," />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    .home {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .home-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .home-name {
      position: absolute;
      top: 34px;
      left: 40px;
      z-index: 2;
      border: none;
      background: transparent;
      padding: 0;
      color: #ffffff;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #site {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }

    .topbar {
      height: 44px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid rgba(17, 17, 17, 0.08);
      background: #ffffff;
      position: relative;
      z-index: 30;
    }

    #brand {
      border: none;
      background: transparent;
      padding: 0;
      font-size: 21px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      color: #111;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      white-space: nowrap;
    }

    .topbar button {
      border: none;
      background: transparent;
      padding: 0;
      font: inherit;
      font-size: 12px;
      font-weight: 400;
      color: #111;
      text-decoration: none;
      cursor: pointer;
    }

    .topbar button:hover,
    .project-card:hover,
    .project-item:hover {
      opacity: 0.65;
    }

    .summary {
      width: 100vw;
      height: calc(100vh - 44px);
      padding: 54px 36px 40px;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }

    .project-card {
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
      cursor: pointer;
      color: #111;
      min-width: 0;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      object-position: center;
      background: #f0f0f0;
    }

    .card-text {
      padding-top: 12px;
      display: block;
    }

    .card-title {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-type {
      display: block;
      font-size: 11px;
      line-height: 1.3;
      color: #555;
      margin-bottom: 5px;
    }

    .card-line {
      display: block;
      font-size: 11px;
      line-height: 1.35;
      color: #222;
    }

    .about,
    .viewer {
      width: 100vw;
      height: calc(100vh - 44px);
      padding: 0;
      margin: 0;
      display: block;
      overflow: hidden;
      background: #ffffff;
    }

    .about-wrap,
    .document-wrap {
      position: relative;
      width: 100vw;
      height: calc(100vh - 44px);
      overflow: hidden;
    }

    .document-scroll {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .document-scroll.is-animating {
      scroll-snap-type: none;
    }

    .document-scroll::-webkit-scrollbar {
      display: none;
    }

    .document-slide {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #ffffff;
    }

    .document-slide img {
      max-width: 100vw;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      background: #ffffff;
      touch-action: pan-y;
    }

    .nav-zone {
      position: absolute;
      left: 0;
      width: 100%;
      height: clamp(72px, 12vh, 104px);
      padding: 0;
      border: none;
      color: #111;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .nav-zone:hover:not(:disabled),
    .nav-zone:focus-visible:not(:disabled) {
      opacity: 1;
    }

    .nav-zone:focus-visible {
      outline: 1px solid rgba(17, 17, 17, 0.3);
      outline-offset: -4px;
    }

    .nav-zone:disabled {
      opacity: 0 !important;
      pointer-events: none;
      cursor: default;
    }

    .nav-zone::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 13px;
      height: 13px;
      border-right: 1.5px solid rgba(17, 17, 17, 0.72);
      border-bottom: 1.5px solid rgba(17, 17, 17, 0.72);
    }

    .nav-up {
      top: 0;
      cursor: n-resize;
      background: linear-gradient(to bottom, rgba(17, 17, 17, 0.055), rgba(17, 17, 17, 0));
    }

    .nav-up::after {
      transform: translate(-50%, -30%) rotate(-135deg);
    }

    .nav-down {
      bottom: 0;
      cursor: s-resize;
      background: linear-gradient(to top, rgba(17, 17, 17, 0.055), rgba(17, 17, 17, 0));
    }

    .nav-down::after {
      transform: translate(-50%, -70%) rotate(45deg);
    }

    .nav-zone.hint:not(:disabled) {
      animation: navigation-hint 1s ease both;
    }

    @keyframes navigation-hint {
      0%, 100% { opacity: 0; }
      20%, 72% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-zone {
        transition: none;
      }

      .nav-zone.hint:not(:hover):not(:focus-visible) {
        animation: none;
        opacity: 0;
      }
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      max-width: 92vw;
      height: 100vh;
      background: #ffffff;
      border-left: 1px solid rgba(17, 17, 17, 0.14);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.08);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 50;
      padding: 28px;
      overflow-y: auto;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .drawer h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-drawer {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      font-size: 22px;
      opacity: 0.55;
      cursor: pointer;
    }

    .project-item {
      width: 100%;
      padding: 16px 0;
      border: none;
      border-bottom: 1px solid rgba(17, 17, 17, 0.12);
      text-align: left;
      background: transparent;
      color: #111;
      cursor: pointer;
    }

    .project-title {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .project-subtitle {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: #555;
    }

    .project-page {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.06);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 45;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <section id="home" class="home">
    <img src="cover-3200.jpg" alt="Guillaume Morvan — Portfolio" class="home-image" />
    <button id="home-name" class="home-name">GUILLAUME MORVAN</button>

  <script>
    const ASSET_VERSION = "2026-06-23-4";

    const VIGNETTE_FOLDER = "Vignettes/";
    const ABOUT_FOLDER = "apropos/";
    const ABOUT_ASSET_VERSION = "2026-07-23-1";
    const ABOUT_TOTAL = 4;
    const ABOUT_ALTS = [
      "Approche architecturale et structure intérieure en bois",
      "Parcours de Guillaume Morvan, photographies de famille et maquette urbaine",
      "Croquis d’architecture et chantier de construction bois",
      "Coordonnées de Guillaume Morvan, portrait et citation de Fernand Pouillon"
    ];
    const CONTROLLED_NAVIGATION_DURATION = 740;
    const CONTROLLED_NAVIGATION_EASING = progress =>
      1 - Math.pow(1 - progress, 5) * (1 + 0.35 * progress);
    const CONTROLLED_NAVIGATION_EASING_VELOCITY = progress =>
      Math.pow(1 - progress, 4) * (4.65 + 2.1 * progress);
    const CONTROLLED_NAVIGATION_EXTRA_PAGE_DURATION = 110;
    const CONTROLLED_NAVIGATION_MIN_DURATION = 240;
    const CONTROLLED_NAVIGATION_MAX_DURATION = 1300;
    const CONTROLLED_NAVIGATION_MAX_FORWARD_VELOCITY = 2.4;
    const CONTROLLED_NAVIGATION_MAX_REVERSE_VELOCITY = 0.8;
    const CONTROLLED_NAVIGATION_LOCK = 100;
    const TRACKPAD_EVENT_INTERVAL = 28;
    const TRACKPAD_SEQUENCE_HOLD = 180;
    const DISCRETE_WHEEL_MIN_DELTA = 80;
    const DISCRETE_WHEEL_STEP_TOLERANCE = 0.08;

    const PROJECTS = [
      {
        slug: "edwood",
        title: "Edwood",
        fullTitle: "Edwood",
        type: "Construction bois",
        line: "Le chantier comme école de la réalité constructive.",
        thumb: "edwood.jpg",
        folder: "pages/",
        filePrefix: "page",
        start: 40,
        end: 43
      },
      {
        slug: "tank",
        title: "TANK",
        fullTitle: "TANK Architectes",
        type: "Expérience en agence",
        line: "L’architecte dans une pratique engagée pour la qualité.",
        thumb: "tank.jpg",
        folder: "pages/",
        filePrefix: "page",
        start: 34,
        end: 39
      },
      {
        slug: "ferme-nord",
        title: "Ferme Nord",
        fullTitle: "Ferme Nord",
        type: "Réhabilitation et extension",
        line: "L’harmonieux contraste.",
        thumb: "ferme-nord.jpg",
        folder: "pages/",
        filePrefix: "page",
        start: 18,
        end: 33
      },
      {
        slug: "saint-joseph",
        title: "Saint-Joseph",
        fullTitle: "Église Saint-Joseph",
        type: "Réhabilitation patrimoniale",
        line: "Révéler les qualités cachées du patrimoine.",
        thumb: "saint-joseph.jpg",
        folder: "pages/",
        filePrefix: "page",
        start: 9,
        end: 17
      },
      {
        slug: "melle",
        title: "Melle",
        fullTitle: "Station ferroviaire Melle",
        type: "Projet urbain et bâtiment mixte",
        line: "Évolutivité et appropriation des espaces.",
        thumb: "melle.jpg",
        folder: "pages/",
        filePrefix: "page",
        start: 4,
        end: 8
      }
    ];

    let currentProject = null;
    let currentImage = null;
    let currentAboutPage = 1;
    let scrollFrame = null;
    let scrollEndTimer = null;
    let resizeTimer = null;
    let hintTimer = null;
    let controlledNavigation = null;
    let lastWheelEventTime = 0;
    let trackpadSequenceUntil = 0;
    let lastDiscreteWheelStep = 0;

    const home = document.getElementById("home");
    const site = document.getElementById("site");
    const summary = document.getElementById("summary");
    const about = document.getElementById("about");
    const viewer = document.getElementById("viewer");
    const projectScroll = document.getElementById("project-scroll");
    const aboutScroll = document.getElementById("about-scroll");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const projectGrid = document.getElementById("project-grid");
    const projectList = document.getElementById("project-list");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function getImageSrc(project, num) {
      return encodeURI(`${project.folder}${project.filePrefix} (${num}).jpg`) + `?v=${ASSET_VERSION}`;
    }

    function getAboutSrc(num) {
      return encodeURI(`${ABOUT_FOLDER}page (${num}).jpg`) + `?v=${ABOUT_ASSET_VERSION}`;
    }

    function getVignetteSrc(filename) {
      return encodeURI(`${VIGNETTE_FOLDER}${filename}`) + `?v=${ASSET_VERSION}`;
    }

    function getPageRange(start, end) {
      return Array.from({ length: end - start + 1 }, (_, index) => start + index);
    }

    function buildDocumentSlides(scroller, pages, getSrc, getAlt, activePage) {
      const fragment = document.createDocumentFragment();

      pages.forEach(page => {
        const slide = document.createElement("section");
        const image = document.createElement("img");

        slide.className = "document-slide";
        slide.dataset.page = page;

        image.src = getSrc(page);
        image.alt = getAlt(page);
        image.decoding = "async";
        image.loading = page === activePage ? "eager" : "lazy";

        if (page === activePage) image.fetchPriority = "high";

        slide.appendChild(image);
        fragment.appendChild(slide);
      });

      scroller.replaceChildren(fragment);
      const activeIndex = Math.max(0, pages.indexOf(activePage));
      scroller.scrollTop = activeIndex * scroller.clientHeight;
    }

    function getClosestDocumentPage(scroller) {
      const slides = scroller.querySelectorAll(".document-slide");
      if (!slides.length || !scroller.clientHeight) return null;

      const index = Math.max(
        0,
        Math.min(slides.length - 1, Math.round(scroller.scrollTop / scroller.clientHeight))
      );

      return parseInt(slides[index].dataset.page, 10);
    }

    function scrollToDocumentPage(scroller, page, smooth = true) {
      const slide = scroller.querySelector(`.document-slide[data-page="${page}"]`);
      if (!slide) return;

      scroller.scrollTo({
        top: slide.offsetTop,
        behavior: smooth && !prefersReducedMotion.matches ? "smooth" : "auto"
      });
    }

    function cancelControlledNavigation() {
      if (!controlledNavigation) return;

      cancelAnimationFrame(controlledNavigation.frame);
      controlledNavigation.scroller.classList.remove("is-animating");
      controlledNavigation = null;
    }

    function getAdaptiveNavigationDuration(scroller, start, end) {
      const remainingPages = Math.abs(end - start) / Math.max(1, scroller.clientHeight);
      const duration = remainingPages <= 1
        ? CONTROLLED_NAVIGATION_DURATION * remainingPages
        : CONTROLLED_NAVIGATION_DURATION +
          (remainingPages - 1) * CONTROLLED_NAVIGATION_EXTRA_PAGE_DURATION;

      return Math.max(
        CONTROLLED_NAVIGATION_MIN_DURATION,
        Math.min(CONTROLLED_NAVIGATION_MAX_DURATION, duration)
      );
    }

    function createContinuationCoefficients(start, velocity, end, duration) {
      const seconds = duration / 1000;
      const distance = end - start;
      const scaledVelocity = velocity * seconds;

      return [
        start,
        scaledVelocity,
        0,
        10 * distance - 6 * scaledVelocity,
        -15 * distance + 8 * scaledVelocity,
        6 * distance - 3 * scaledVelocity
      ];
    }

    function getStableContinuationVelocity(start, velocity, end, duration) {
      const distance = end - start;
      if (!distance) return 0;

      const seconds = duration / 1000;
      const normalizedVelocity = velocity * seconds / distance;
      const stableVelocity = Math.max(
        -CONTROLLED_NAVIGATION_MAX_REVERSE_VELOCITY,
        Math.min(CONTROLLED_NAVIGATION_MAX_FORWARD_VELOCITY, normalizedVelocity)
      );

      return stableVelocity * distance / seconds;
    }

    function sampleControlledNavigation(state, now) {
      if (state.settledAt !== null) {
        return {
          progress: 1,
          position: state.targetTop,
          velocity: 0
        };
      }

      const progress = Math.min(
        1,
        Math.max(0, (now - state.segmentStartTime) / state.segmentDuration)
      );
      const seconds = state.segmentDuration / 1000;

      if (!state.coefficients) {
        const distance = state.targetTop - state.segmentStartTop;
        return {
          progress,
          position:
            state.segmentStartTop + distance * CONTROLLED_NAVIGATION_EASING(progress),
          velocity:
            distance * CONTROLLED_NAVIGATION_EASING_VELOCITY(progress) / seconds
        };
      }

      const [c0, c1, c2, c3, c4, c5] = state.coefficients;
      const progress2 = progress * progress;
      const progress3 = progress2 * progress;
      const progress4 = progress3 * progress;
      const progress5 = progress4 * progress;

      return {
        progress,
        position:
          c0 + c1 * progress + c2 * progress2 + c3 * progress3 +
          c4 * progress4 + c5 * progress5,
        velocity:
          (c1 + 2 * c2 * progress + 3 * c3 * progress2 +
          4 * c4 * progress3 + 5 * c5 * progress4) / seconds
      };
    }

    function finishControlledNavigation(state) {
      if (controlledNavigation !== state) return;

      state.scroller.scrollTop = state.targetTop;
      state.scroller.classList.remove("is-animating");
      controlledNavigation = null;
      syncActivePage(state.scroller);
    }

    function stepControlledNavigation(now) {
      const state = controlledNavigation;
      if (!state) return;

      const sample = sampleControlledNavigation(state, now);
      state.scroller.scrollTop = sample.position;

      if (sample.progress < 1) {
        state.frame = requestAnimationFrame(stepControlledNavigation);
        return;
      }

      state.scroller.scrollTop = state.targetTop;
      syncActivePage(state.scroller);

      if (state.settledAt === null) state.settledAt = now;

      if (now - state.settledAt < CONTROLLED_NAVIGATION_LOCK) {
        state.frame = requestAnimationFrame(stepControlledNavigation);
        return;
      }

      finishControlledNavigation(state);
    }

    function retargetControlledNavigation(state, targetIndex, now) {
      const slide = state.slides[targetIndex];
      if (!slide) return false;

      const sample = sampleControlledNavigation(state, now);
      const targetTop = slide.offsetTop;
      const duration = getAdaptiveNavigationDuration(
        state.scroller,
        sample.position,
        targetTop
      );
      const velocity = getStableContinuationVelocity(
        sample.position,
        sample.velocity,
        targetTop,
        duration
      );

      state.scroller.scrollTop = sample.position;
      state.targetIndex = targetIndex;
      state.targetTop = targetTop;
      state.segmentStartTime = now;
      state.segmentStartTop = sample.position;
      state.segmentDuration = duration;
      state.coefficients = createContinuationCoefficients(
        sample.position,
        velocity,
        targetTop,
        duration
      );
      state.settledAt = null;
      return true;
    }

    function animateDocumentPage(scroller, page, targetIndex) {
      const slide = scroller.querySelector(`.document-slide[data-page="${page}"]`);
      if (!slide) return false;

      if (prefersReducedMotion.matches) {
        cancelControlledNavigation();
        scroller.scrollTop = slide.offsetTop;
        syncActivePage(scroller);
        return true;
      }

      const now = performance.now();

      if (controlledNavigation && controlledNavigation.scroller !== scroller) {
        cancelControlledNavigation();
      }

      if (controlledNavigation) {
        return retargetControlledNavigation(controlledNavigation, targetIndex, now);
      }

      const start = scroller.scrollTop;
      const end = slide.offsetTop;
      if (Math.abs(end - start) <= 1) return false;

      const slides = Array.from(scroller.querySelectorAll(".document-slide"));
      scroller.classList.add("is-animating");
      controlledNavigation = {
        scroller,
        slides,
        targetIndex,
        targetTop: end,
        segmentStartTime: now,
        segmentStartTop: start,
        segmentDuration: getAdaptiveNavigationDuration(scroller, start, end),
        coefficients: null,
        settledAt: null,
        frame: requestAnimationFrame(stepControlledNavigation)
      };
      return true;
    }

    function navigateDocument(scroller, direction, actionCount = 1) {
      if (!direction || actionCount < 1) return false;

      const slides = Array.from(scroller.querySelectorAll(".document-slide"));
      if (!slides.length) return false;

      const activeNavigation =
        controlledNavigation && controlledNavigation.scroller === scroller
          ? controlledNavigation
          : null;
      const currentPage = getClosestDocumentPage(scroller);
      const visibleIndex = slides.findIndex(
        slide => parseInt(slide.dataset.page, 10) === currentPage
      );
      const originIndex = activeNavigation ? activeNavigation.targetIndex : visibleIndex;
      const targetIndex = Math.max(
        0,
        Math.min(slides.length - 1, originIndex + direction * actionCount)
      );

      if (originIndex < 0 || targetIndex === originIndex) return false;

      return animateDocumentPage(
        scroller,
        parseInt(slides[targetIndex].dataset.page, 10),
        targetIndex
      );
    }

    function isDiscreteWheelStep(value, step) {
      const ratio = value / step;
      return Math.abs(ratio - Math.round(ratio)) <= DISCRETE_WHEEL_STEP_TOLERANCE;
    }

    function isClearlyDiscreteWheel(e) {
      const now = performance.now();
      const gap = lastWheelEventTime ? now - lastWheelEventTime : Infinity;
      const deltaY = Math.abs(e.deltaY);
      const deltaX = Math.abs(e.deltaX);
      lastWheelEventTime = now;

      if (!deltaY) return false;
      if (e.deltaMode === 1 || e.deltaMode === 2) return true;
      if (e.deltaMode !== 0) return false;

      const looksContinuous = gap < TRACKPAD_EVENT_INTERVAL;
      const looksFineGrained =
        deltaY < DISCRETE_WHEEL_MIN_DELTA ||
        !Number.isInteger(e.deltaY) ||
        deltaX > 0.5 ||
        looksContinuous;

      if (looksFineGrained) {
        trackpadSequenceUntil = now + TRACKPAD_SEQUENCE_HOLD;
      }

      if (now < trackpadSequenceUntil) return false;

      const hasDiscreteStep =
        isDiscreteWheelStep(deltaY, 100) ||
        isDiscreteWheelStep(deltaY, 120);

      return hasDiscreteStep && (gap === Infinity || gap >= TRACKPAD_EVENT_INTERVAL);
    }

    function getDiscreteWheelActionCount(e) {
      if (e.deltaMode !== 0) return 1;

      const deltaY = Math.abs(e.deltaY);
      const matchingSteps = [100, 120].filter(
        step => isDiscreteWheelStep(deltaY, step)
      );

      if (!matchingSteps.length) return 1;

      const step = matchingSteps.includes(lastDiscreteWheelStep)
        ? lastDiscreteWheelStep
        : matchingSteps[0];
      lastDiscreteWheelStep = step;
      return Math.max(1, Math.round(deltaY / step));
    }

    function handleWheelNavigation(e, scroller, forwardNative = false) {
      if (isClearlyDiscreteWheel(e)) {
        e.preventDefault();
        navigateDocument(
          scroller,
          e.deltaY > 0 ? 1 : -1,
          getDiscreteWheelActionCount(e)
        );
        return;
      }

      if (controlledNavigation && controlledNavigation.scroller === scroller) {
        cancelControlledNavigation();
      }

      if (forwardNative) {
        scroller.scrollBy({ top: e.deltaY, behavior: "auto" });
      }
    }

    function syncActivePage(scroller) {
      const page = getClosestDocumentPage(scroller);
      if (!page) return;

      if (scroller === projectScroll && !viewer.classList.contains("hidden") && currentProject) {
        if (page === currentImage) return;
        currentImage = page;
        updateUrl(currentImage);
        updateNavState();
      }

      if (scroller === aboutScroll && !about.classList.contains("hidden")) {
        if (page === currentAboutPage) return;
        currentAboutPage = page;
        updateAboutNavState();
      }
    }

    function settleDocumentScroll(scroller) {
      if (controlledNavigation && controlledNavigation.scroller === scroller) return;

      const page = getClosestDocumentPage(scroller);
      if (!page) return;

      const slide = scroller.querySelector(`.document-slide[data-page="${page}"]`);
      if (!slide) return;

      syncActivePage(scroller);

      if (Math.abs(scroller.scrollTop - slide.offsetTop) > 1) {
        scrollToDocumentPage(scroller, page, true);
      }
    }

    function handleDocumentScroll(e) {
      const scroller = e.currentTarget;

      if (scrollFrame) cancelAnimationFrame(scrollFrame);
      scrollFrame = requestAnimationFrame(() => syncActivePage(scroller));

      clearTimeout(scrollEndTimer);
      scrollEndTimer = setTimeout(() => settleDocumentScroll(scroller), 160);
    }

    function showInitialNavigationHint(button) {
      clearTimeout(hintTimer);
      button.classList.remove("hint");

      if (button.disabled || prefersReducedMotion.matches) return;

      requestAnimationFrame(() => {
        button.classList.add("hint");
        hintTimer = setTimeout(() => button.classList.remove("hint"), 1050);
      });
    }

    function clearUrl() {
      history.replaceState({}, "", window.location.pathname);
    }

    function updateUrl(num) {
      const url = new URL(window.location);
      if (currentProject) url.searchParams.set("project", currentProject.slug);
      url.searchParams.set("page", num);
      history.replaceState({}, "", url);
    }

    function hideAllMainViews() {
      cancelControlledNavigation();
      lastWheelEventTime = 0;
      trackpadSequenceUntil = 0;
      lastDiscreteWheelStep = 0;
      summary.classList.add("hidden");
      about.classList.add("hidden");
      viewer.classList.add("hidden");
    }

    function showSummary() {
      home.classList.add("hidden");
      site.classList.remove("hidden");
      hideAllMainViews();
      summary.classList.remove("hidden");
      currentProject = null;
      currentImage = null;
      closeDrawer();
      clearUrl();
    }

    function showAbout() {
      home.classList.add("hidden");
      site.classList.remove("hidden");
      hideAllMainViews();
      about.classList.remove("hidden");
      currentProject = null;
      currentImage = null;
      closeDrawer();
      clearUrl();
      buildDocumentSlides(
        aboutScroll,
        getPageRange(1, ABOUT_TOTAL),
        getAboutSrc,
        page => ABOUT_ALTS[page - 1],
        1
      );
      goToAboutPage(1, false);
      showInitialNavigationHint(document.getElementById("about-next"));
    }

    function showViewer(project, targetPage) {
      const requestedPage = parseInt(targetPage, 10);
      const target = requestedPage >= project.start && requestedPage <= project.end
        ? requestedPage
        : project.start;

      currentProject = project;
      home.classList.add("hidden");
      site.classList.remove("hidden");
      hideAllMainViews();
      viewer.classList.remove("hidden");
      buildDocumentSlides(
        projectScroll,
        getPageRange(project.start, project.end),
        page => getImageSrc(project, page),
        () => "Portfolio Guillaume Morvan",
        target
      );
      goToPage(target, false, false);
      showInitialNavigationHint(document.getElementById("next-side"));
    }

    function goToPage(num, close = true, smooth = true) {
      const target = parseInt(num, 10);
      if (!currentProject || !target) return;
      if (target < currentProject.start || target > currentProject.end) return;

      if (!smooth || prefersReducedMotion.matches) {
        currentImage = target;
        updateUrl(currentImage);
        updateNavState();
      }

      scrollToDocumentPage(projectScroll, target, smooth);

      if (close) closeDrawer();
    }

    function previousPage() {
      if (!currentProject) return;
      navigateDocument(projectScroll, -1);
    }

    function nextPage() {
      if (!currentProject) return;
      navigateDocument(projectScroll, 1);
    }

    function goToAboutPage(num, smooth = true) {
      if (num < 1 || num > ABOUT_TOTAL) return;

      if (!smooth || prefersReducedMotion.matches) {
        currentAboutPage = num;
        updateAboutNavState();
      }

      scrollToDocumentPage(aboutScroll, num, smooth);
    }

    function previousAboutPage() {
      navigateDocument(aboutScroll, -1);
    }

    function nextAboutPage() {
      navigateDocument(aboutScroll, 1);
    }

    function updateNavState() {
      document.getElementById("prev-side").disabled = !currentProject || currentImage <= currentProject.start;
      document.getElementById("next-side").disabled = !currentProject || currentImage >= currentProject.end;
    }

    function updateAboutNavState() {
      document.getElementById("about-prev").disabled = currentAboutPage <= 1;
      document.getElementById("about-next").disabled = currentAboutPage >= ABOUT_TOTAL;
    }

    function openDrawer() {
      drawer.classList.add("open");
      overlay.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("open");
    }

    function buildProjectCards() {
      projectGrid.innerHTML = "";
      PROJECTS.forEach((project, index) => {
        const button = document.createElement("button");
        button.className = "project-card";
        button.innerHTML = `
          <img class="thumb" src="${getVignetteSrc(project.thumb)}" alt="${project.fullTitle}" />
          <span class="card-text">
            <span class="card-title">${String(index + 1).padStart(2, "0")} — ${project.title}</span>
            <span class="card-type">${project.type}</span>
            <span class="card-line">${project.line}</span>
          </span>
        `;
        button.addEventListener("click", () => showViewer(project, project.start));
        projectGrid.appendChild(button);
      });
    }

    function buildProjectList() {
      projectList.innerHTML = "";
      PROJECTS.forEach((project, index) => {
        const button = document.createElement("button");
        button.className = "project-item";
        button.innerHTML = `
          <span class="project-title">${String(index + 1).padStart(2, "0")} — ${project.fullTitle}</span>
          <span class="project-subtitle">${project.line}</span>
        `;
        button.addEventListener("click", () => {
          showViewer(project, project.start);
          closeDrawer();
        });
        projectList.appendChild(button);
      });
    }

    function realignActiveDocument() {
      cancelControlledNavigation();

      if (!viewer.classList.contains("hidden") && currentImage) {
        scrollToDocumentPage(projectScroll, currentImage, false);
      }

      if (!about.classList.contains("hidden") && currentAboutPage) {
        scrollToDocumentPage(aboutScroll, currentAboutPage, false);
      }
    }

    home.addEventListener("click", showSummary);
    document.getElementById("home-name").addEventListener("click", showSummary);
    document.getElementById("brand").addEventListener("click", showSummary);
    document.getElementById("about-btn").addEventListener("click", showAbout);

    document.getElementById("projects-btn").addEventListener("click", () => {
      if (!viewer.classList.contains("hidden")) openDrawer();
      else showSummary();
    });

    document.getElementById("close-drawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);

    document.getElementById("prev-side").addEventListener("click", previousPage);
    document.getElementById("next-side").addEventListener("click", nextPage);
    document.getElementById("about-prev").addEventListener("click", previousAboutPage);
    document.getElementById("about-next").addEventListener("click", nextAboutPage);

    projectScroll.addEventListener("scroll", handleDocumentScroll, { passive: true });
    aboutScroll.addEventListener("scroll", handleDocumentScroll, { passive: true });
    projectScroll.addEventListener(
      "wheel",
      e => handleWheelNavigation(e, projectScroll),
      { passive: false }
    );
    aboutScroll.addEventListener(
      "wheel",
      e => handleWheelNavigation(e, aboutScroll),
      { passive: false }
    );

    document.getElementById("prev-side").addEventListener(
      "wheel",
      e => handleWheelNavigation(e, projectScroll, true),
      { passive: false }
    );
    document.getElementById("next-side").addEventListener(
      "wheel",
      e => handleWheelNavigation(e, projectScroll, true),
      { passive: false }
    );
    document.getElementById("about-prev").addEventListener(
      "wheel",
      e => handleWheelNavigation(e, aboutScroll, true),
      { passive: false }
    );
    document.getElementById("about-next").addEventListener(
      "wheel",
      e => handleWheelNavigation(e, aboutScroll, true),
      { passive: false }
    );

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeDrawer();
        return;
      }

      if (drawer.classList.contains("open")) return;

      const viewerIsOpen = !viewer.classList.contains("hidden");
      const aboutIsOpen = !about.classList.contains("hidden");
      const previousKey = e.key === "ArrowUp" || e.key === "PageUp";
      const nextKey = e.key === "ArrowDown" || e.key === "PageDown";

      if ((!viewerIsOpen && !aboutIsOpen) || (!previousKey && !nextKey)) return;

      e.preventDefault();

      if (previousKey) {
        if (viewerIsOpen) previousPage();
        if (aboutIsOpen) previousAboutPage();
      }

      if (nextKey) {
        if (viewerIsOpen) nextPage();
        if (aboutIsOpen) nextAboutPage();
      }
    });

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(realignActiveDocument, 120);
    });

    buildProjectCards();
    buildProjectList();

    const params = new URLSearchParams(window.location.search);
    const directPage = parseInt(params.get("page"), 10);
    const directProjectSlug = params.get("project");

    let directProject = null;

    if (directProjectSlug) {
      directProject = PROJECTS.find(project => project.slug === directProjectSlug);
    }

    if (!directProject) {
      directProject = PROJECTS.find(project => directPage >= project.start && directPage <= project.end);
    }

    if (directProject) showViewer(directProject, directPage);
  </script>
</body>
</html>
